<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title }}</title>
    <meta name="description" content="{{ page.description }}">
    <meta name="robots" content="index, follow">
    <meta name="author" content="Hritik Suman">
    <meta name="keywords" content="{{ page.keywords }}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{{ site.url }}{{ site.baseurl }}{{ page.url }}">
    <meta property="og:title" content="{{ page.title }}">
    <meta property="og:description" content="{{ page.og_description | default: page.description }}">
    <meta property="og:site_name" content="Hritik Suman">
    <meta property="og:image" content="{{ site.url }}{{ site.baseurl }}/social-preview.svg">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ page.title }}">
    <meta name="twitter:description" content="{{ page.og_description | default: page.description }}">
    <meta name="twitter:image" content="{{ site.url }}{{ site.baseurl }}/social-preview.svg">
    <meta name="theme-color" content="#4338ca">
    <link rel="canonical" href="{{ site.url }}{{ site.baseurl }}{{ page.url }}">
    <link rel="icon" type="image/svg+xml" href="{{ site.baseurl }}/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ site.baseurl }}/style.css">
</head>
<body>

<nav>
    <div class="nav-inner">
        <a href="{{ site.baseurl }}/index.html" class="nav-logo">Hritik Suman</a>
        <button class="nav-mobile-toggle" onclick="document.querySelector('.nav-links').classList.toggle('open')" aria-label="Menu">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h14M3 12h14M3 18h14"/></svg>
        </button>
        <ul class="nav-links">
            <li><a href="{{ site.baseurl }}/index.html"{% if page.page_id == 'home' %} class="active"{% endif %}>Home</a></li>
            <li><a href="{{ site.baseurl }}/about.html"{% if page.page_id == 'about' %} class="active"{% endif %}>About</a></li>
            <li><a href="{{ site.baseurl }}/experience.html"{% if page.page_id == 'experience' %} class="active"{% endif %}>Experience</a></li>
            <li><a href="{{ site.baseurl }}/projects.html"{% if page.page_id == 'projects' %} class="active"{% endif %}>Projects</a></li>
            <li><a href="{{ site.baseurl }}/blog.html"{% if page.page_id == 'blog' %} class="active"{% endif %}>Blog</a></li>
        </ul>
        <a href="{{ site.baseurl }}/contact.html" class="nav-cta"{% if page.page_id == 'contact' %} style="background:var(--accent);"{% endif %}>Hire me</a>
    </div>
</nav>

<main>
{{ content }}
</main>

            <a href="https://dev.to/hritiksum" target="_blank">Dev.to</a>
            <a href="mailto:hritik.sum@gmail.com">Email</a>
        </div>
    </div>
</footer>

<script>
    const observer = new IntersectionObserver(entries => {
        entries.forEach((e, i) => { if(e.isIntersecting) { setTimeout(()=>e.target.classList.add('visible'), i*60); observer.unobserve(e.target); } });
    }, { threshold:.08, rootMargin:'0px 0px -20px 0px' });
    document.querySelectorAll('.fade-up').forEach(el => observer.observe(el));
</script>
</body>
</html>
